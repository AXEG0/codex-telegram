name: test

# Check the runtime and owned test fixtures on pull requests and main.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # npm's compiler cache is not a fixture and must not pollute leak checks.
  NODE_DISABLE_COMPILE_CACHE: "1"

jobs:
  runtime:
    name: runtime check and tests (Node ${{ matrix.node }})
    # GitHub-hosted ARM64 exercises the Linux runtime.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
        working-directory: plugins/gelios-codex-telegram
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node test/support/check-release.js "$RELEASE_BASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

  thread-lifecycle:
    name: real Codex thread lifecycle (${{ matrix.codex }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.160.0", "0.162.0"]
    defaults:
      run:
        shell: bash
        working-directory: plugins/gelios-codex-telegram
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Codex runtime
        run: npm install --prefix "$RUNNER_TEMP/gelios-codex" --no-audit --no-fund "@openai/codex@${{ matrix.codex }}"
      - name: Verify real thread unload, resume and delivery
        env:
          GELIOS_REAL_CODEX_BIN: ${{ runner.temp }}/gelios-codex/node_modules/.bin/codex
        run: node test/support/run-tests.js test/thread-recovery.integration.test.js test/turn-retry.integration.test.js test/telegram-guide.integration.test.js
